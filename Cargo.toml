[package]
name = "g3-route-transitions"
version = "0.6.0"

edition = "2024"
description = "Route-owned View Transition helpers for Dioxus Router."
repository = "https://github.com/g3techhq/g3-route-transitions"
readme = "README.md"
documentation = "https://docs.rs/g3-route-transitions"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "router", "transitions", "view-transitions"]
categories = ["gui", "wasm", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**", "assets/**", "tests/**"]

[lib]
name = "g3_route_transitions"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }
g3-route-transitions-macros = { version = "0.5.1", path = "macros" }
manganis = "=0.8.0-alpha.3"
g3-native-plugins = { version = "0.4.0", default-features = false, optional = true }

[features]
default = []
native-back = ["dep:g3-native-plugins", "g3-native-plugins/back-button"]
# Log how long each phase of every animated navigation took, through `tracing`.
timing = ["dioxus/logger"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.102", features = ["Navigator", "Performance", "Window"] }

[dev-dependencies]
# Renders regions to HTML in tests/regions.rs.
dioxus-ssr = "=0.8.0-alpha.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
trybuild = "1"

[package.metadata.docs.rs]
# Document the native-back hooks and the timing feature too.
features = ["native-back", "timing"]

[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# g3-native-plugins (behind `native-back`) depends on dioxus-signals directly.
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-ssr = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# g3 crates are not published until Dioxus 0.8.0:
g3-native-plugins = { git = "https://github.com/g3techhq/g3-native-plugins", branch = "main" }

[lints.clippy]
cloned_instead_of_copied = "warn"
allow_attributes_without_reason = "warn"
